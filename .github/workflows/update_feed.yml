name: Update RSS Feed & Deploy to GitHub Pages

on:
  schedule:
    # Her 30 dakikada bir otomatik çalışır (cron: dakika saat gün ay haftanın_günü)
    - cron: "*/30 * * * *"
  workflow_dispatch: # GitHub arayüzünden manuel tetikleme desteği
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore SQLite Database Cache
        uses: actions/cache@v4
        with:
          path: data/feed_items.db
          key: feed-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            feed-db-${{ runner.os }}-

      - name: Generate Static RSS Feed
        env:
          INOREADER_URL: "https://www.inoreader.com/stream/user/1006125058/tag/SU/view/html?cs=m"
          PUBLIC_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: |
          python export_static.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
